name: Build and deploy Flutter Web
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Show SDK versions
        run: |
          flutter --version
          dart --version
      - run: flutter pub get --enforce-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/requirements-fonts.txt
      - run: python scripts/prepare_fonts.py
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/comments_test.mjs
      - run: flutter build web --release --base-href / --no-web-resources-cdn
      - run: cp CNAME build/web/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
